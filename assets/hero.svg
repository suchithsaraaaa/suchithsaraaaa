<text x="56" y="214" font-family="'SF Mono','JetBrains Mono',Menlo,Consolas,monospace" font-size="20" fill="#5ee7ff">AI Engineer<tspan fill="#6f8596">  /  </tspan>Systems Builder</text>
<text x="56" y="268" font-family="'Segoe UI',Helvetica,Arial,sans-serif" font-size="19" fill="#b5c7d3">I build the systems that have to work when it counts:</text>
